plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
    id 'com.gradleup.shadow' version '8.3.5'
}

version = mod_version
group = 'fr.nathvavan.nathbot'

base {
    archivesName = 'nathbot-1.20.1-forge'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        client {
            workingDirectory project.file('run')
            mods { nathbot { source sourceSets.main } }
        }
    }
}

repositories {
    mavenCentral()
}

configurations {
    // bibliotheques copiees DANS le .jar du mod (renommees pour ne gener aucun autre mod)
    shade
    implementation.extendsFrom shade
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'
    // moteur JavaScript pour les scripts en direct (WorldEdit en embarque aussi une copie :
    // on renomme la notre en fr.nathvavan.nathbot.libs.rhino pour eviter tout conflit)
    shade 'org.mozilla:rhino:1.7.15'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') {
        expand 'version': project.version
    }
}

jar {
    manifest {
        attributes([
            'Specification-Title'   : 'nathbot',
            'Specification-Vendor'  : 'Nath et Vavan',
            'Specification-Version' : '1',
            'Implementation-Title'  : project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor' : 'Nath et Vavan'
        ])
    }
    finalizedBy 'reobfJar'
    archiveClassifier = 'slim'
}

shadowJar {
    archiveClassifier = ''
    configurations = [project.configurations.shade]
    relocate 'org.mozilla', 'fr.nathvavan.nathbot.libs.rhino'
    exclude 'module-info.class', 'META-INF/maven/**', 'META-INF/versions/**'
    finalizedBy 'reobfShadowJar'
}

reobf {
    shadowJar {}
}

tasks.named('assemble') { dependsOn 'shadowJar' }
