name: Compiler NathBot

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compiler le mod
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon

      - name: Fichier .jar (onglet Actions > ce build > Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: nathbot-jar
          path: build/libs/*.jar

      - name: Publier le .jar dans "Releases" (lien de telechargement direct)
        if: github.ref == 'refs/heads/nathbot' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nathbot-latest
          name: NathBot (derniere version)
          body: |
            Mod Forge 1.20.1. Telecharge le .jar ci-dessous et mets-le dans le dossier `mods`
            de ton instance CurseForge (clic droit sur l'instance > Open Folder > mods).
          files: build/libs/*.jar
          make_latest: true
