name: Compiler NathBot

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compiler le mod
        run: |
          chmod +x ./gradlew
          set -o pipefail
          if ! ./gradlew build --no-daemon 2>&1 | tee build.log; then
            # erreurs publiees en "annotations" (lisibles sans compte GitHub)
            grep -E "\.java:[0-9]+: error|What went wrong|^> " build.log | head -n 40 | while IFS= read -r l; do echo "::error::$l"; done
            grep -A3 -E "\.java:[0-9]+: error" build.log | head -n 60 | while IFS= read -r l; do echo "::warning::$l"; done
            exit 1
          fi

      - name: Fichier .jar (onglet Actions > ce build > Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: nathbot-jar
          path: build/libs/*.jar

      - name: Publier le .jar dans "Releases" (lien de telechargement direct)
        if: github.ref == 'refs/heads/nathbot' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nathbot-latest
          name: NathBot (derniere version)
          body: |
            Mod Forge 1.20.1. Telecharge le .jar ci-dessous et mets-le dans le dossier `mods`
            de ton instance CurseForge (clic droit sur l'instance > Open Folder > mods).
          files: build/libs/*.jar
          make_latest: true
